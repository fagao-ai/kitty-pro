# `await-holding-invalid-types` used to list `generational_box::*` and
# `dioxus_signals::WriteLock`: the borrow types the Dioxus shells left hanging over
# an `.await`. Neither crate is in the tree now, and NSH has no replacement to name,
# because its signals borrow only inside `Signal::with(..)` / `modify(..)` and return
# the value, so there is no guard to hold. The hazard moved to plain `Rc<RefCell<_>>`
# borrows, which rustc already reports as a borrow that must be `Send`.
await-holding-invalid-types = []
