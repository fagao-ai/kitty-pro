name: Set up NSH
description: >
  Install the pinned NSH CLI for this runner's platform, then prove it is the NSH the app's
  crates are at and add the platform runtimes the job needs.
inputs:
  version:
    description: The NSH release to install, such as v0.5.0
    required: true
  components:
    description: >
      Space-separated runtimes this job packages that are not this machine's own
      (`android`, `web`, `ios`); NSH 0.5 downloads them separately from the CLI.
    required: false
    default: ''
runs:
  using: composite
  steps:
    # Two installers, not one script: NSH ships a POSIX `install.sh` and a
    # PowerShell `install.ps1`, and `install.sh` refuses every non-Linux/macOS
    # `uname`, so piping it on a Windows runner fails the step before it builds
    # anything. Each puts the distribution where its own platform keeps it, and
    # each publishes `bin` through GITHUB_PATH so later steps find `nsh` —
    # `install.ps1` edits the *user* PATH, which a running job does not re-read.
    - name: Install the NSH CLI
      if: runner.os != 'Windows'
      shell: bash
      env:
        NSH_VERSION: ${{ inputs.version }}
      run: |
        curl -fsSL https://nsh.dev/install.sh | sh
        echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"

    - name: Install the NSH CLI
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        NSH_VERSION: ${{ inputs.version }}
      run: |
        # Saved to a file and run from there, rather than `iwr | iex` as NSH's own
        # docs show. `nsh.dev/install.ps1` is served as
        # `content-type: application/octet-stream`, so PowerShell hands back
        # `.Content` as a *byte array*, and `[scriptblock]::Create` on one stringifies
        # it element by element: the script it tries to parse begins
        # `35 32 73 110 115 116 97 108 108 115` ("# Installs N") and dies with a
        # parse error before installing anything. `-OutFile` writes the bytes to disk
        # untouched, which is what an installer of any content-type needs anyway. The
        # script reads no $PSScriptRoot or $MyInvocation path, so running it from a
        # temporary file is equivalent to running it inline.
        $installer = Join-Path $env:RUNNER_TEMP 'install-nsh.ps1'
        iwr https://nsh.dev/install.ps1 -UseBasicParsing -OutFile $installer
        if (-not (Test-Path -Path $installer -PathType Leaf)) {
          throw "nsh: the installer was not written to $installer"
        }
        if ((Get-Item $installer).Length -eq 0) {
          throw "nsh: the installer downloaded empty"
        }
        & $installer
        $dir = if ($env:NSH_INSTALL_DIR) { $env:NSH_INSTALL_DIR } else { Join-Path $env:LOCALAPPDATA 'nsh' }
        $bin = Join-Path $dir 'bin'
        if (-not (Test-Path -Path (Join-Path $bin 'nsh.exe') -PathType Leaf)) {
          throw "nsh: no nsh.exe under $bin after installing"
        }
        Add-Content -Path $env:GITHUB_PATH -Value $bin

    # The version and the components are checked by the script the repository
    # tests locally, so CI and a laptop cannot disagree about what a valid NSH is.
    # Cargo has to be installed first: the check reads the crates it resolves.
    - name: Check the NSH version and install its runtimes
      shell: bash
      run: ./scripts/setup-nsh.sh ${{ inputs.components }}
