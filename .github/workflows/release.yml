name: Build release packages

# Three channels are published, all from the one NSH crate: the desktop app, the
# self-hosted web server (the WebAssembly page beside the native process that runs
# the core for it), and the Android APK.
#
# The asset NAMES are load-bearing, not cosmetics: `proxy_core::update` picks the
# one asset a user may install out of the file name alone — its kind (`web`,
# `.apk`, or a named operating system), its OS, and the CPU groups it lists. A name
# that drops a token silently stops that platform being updatable, so the names here
# are the ones `packages/proxy-core/src/update.rs` asserts in its tests, and an edit
# to one must be an edit to the other.
#
# NOT YET EXERCISED: this file was rewritten when the desktop packaging moved off
# `dx bundle`, and the web and Android jobs are new since. Run it from a throwaway
# tag before publishing a real release.
on:
  workflow_dispatch:
    inputs:
      test_version:
        description: "Version for a non-release build (e.g. 0.0.0-test.1). Leave empty to fail."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # Keep Cargo away from the Git-based crates.io index and libgit2. Windows
  # runners can otherwise crash while reading a restored registry index.
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUST_BACKTRACE: "1"
  RUST_VERSION: "1.97.1"
  # The NSH CLI every job installs, pinned to the release the crates in
  # `packages/nsh-app` are at. Unpinned, a fresh upstream release silently changes
  # what a tag builds: `scripts/setup-nsh.sh` compares the two versions and fails
  # the job rather than publishing an artifact whose runtime and Rust half disagree.
  # Bumping this means bumping the crates in the same commit.
  NSH_VERSION: "v0.5.0"

jobs:
  desktop:
    name: Desktop | ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            id: macos
            # GitHub retired the `macos-14` image: jobs on it are cancelled in ~1s
            # with "The configuration 'macos-14-arm64-us-default' is not supported",
            # before any step runs. `macos-15` is the same arm64 hardware, so the
            # `aarch64` that the update check reads out of the asset name still
            # describes the binary inside. Pinned rather than `macos-latest`, which
            # already moves on to macOS 26 and would change the SDK under a tag.
            os: macos-15
            target: macos
          - name: Windows
            id: windows
            os: windows-latest
            target: windows
          - name: Linux
            id: linux
            os: ubuntu-24.04
            target: linux
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      # NSH's Linux host is GTK 4.14+, which ubuntu-24.04's libgtk-4-dev is.
      # librsvg2 is needed by the `svg` feature the app's icons use.
      #
      # NSH 0.5.0's Linux host plays media through GStreamer, so gstreamer-sys
      # now asks pkg-config for gstreamer-1.0 (and -app, -audio, -base, which
      # libgstreamer-plugins-base1.0-dev brings). Ubuntu's containers do not
      # carry those headers by default, and the failure is not a missing crate:
      # it is one build script that exits before any Rust error, on the runner
      # only, because a development machine has them from another install.
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            librsvg2-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            patchelf \
            pkg-config

      - name: Install MinGW for the Windows Go bridge
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/singbox/bridge/go.mod
          cache-dependency-path: packages/singbox/bridge/go.sum

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Windows MSVC target
        if: matrix.id == 'windows'
        shell: bash
        run: rustup target add x86_64-pc-windows-msvc

      - name: Add MinGW to PATH
        if: runner.os == 'Windows'
        shell: bash
        run: |
          msys2_root='${{ steps.msys2.outputs.msys2-location }}'
          msys2_root="${msys2_root//\\//}"
          mingw_bin="$msys2_root/mingw64/bin"
          echo "$mingw_bin" >> "$GITHUB_PATH"
          echo "SINGBOX_CC=$mingw_bin/gcc.exe" >> "$GITHUB_ENV"
          echo 'CGO_ENABLED=1' >> "$GITHUB_ENV"

      # The desktop job needs no component: it packages for the machine it runs on,
      # whose runtime ships inside the CLI's own archive.
      - name: Set up NSH
        uses: ./.github/actions/setup-nsh
        with:
          version: ${{ env.NSH_VERSION }}

      # Every package in the workspace takes the tag's version, including `api`,
      # which is the crate the in-app update check actually answers with. Stamping
      # only the shell's own crate is what made every desktop release report 0.1.0.
      - name: Set tagged app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          release_version="$(
            jq -nr --arg tag "$GITHUB_REF_NAME" '$tag | ltrimstr("v")'
          )"
          ./scripts/set-package-version.sh "$release_version"

      # A `workflow_dispatch` build is not a release, and must not pretend to be
      # one: an unsigned test archive that reports the newest published version
      # tells its installer there is nothing to update, forever. Fail loudly
      # instead, unless the operator names a version deliberately.
      - name: Reject an unversioned manual build
        if: "!startsWith(github.ref, 'refs/tags/v')"
        shell: bash
        env:
          KITTY_TEST_VERSION: ${{ inputs.test_version }}
        run: |
          if [[ -z "${KITTY_TEST_VERSION:-}" ]]; then
            echo "This run is not from a v* tag, so nothing here carries a release version." >&2
            echo "Enter test_version to build a throwaway with that version, or push a tag." >&2
            exit 1
          fi
          ./scripts/set-package-version.sh "$KITTY_TEST_VERSION"
          echo "Building a NON-RELEASE at $KITTY_TEST_VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Cache Rust builds
        if: matrix.id != 'windows'
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.id }}
          cache-all-crates: true

      # The embedded sing-box core is a Go archive; on Windows it is a DLL built
      # by the bridge. This gate is independent of which front end ships, so it
      # stayed after the Dioxus shells were removed.
      - name: Test Windows embedded core bridge
        if: matrix.id == 'windows'
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/kitty-pro-windows-test.log"
          if {
              (cd packages/singbox/bridge && go test ./...)
              cargo test \
                --package singbox \
                --target x86_64-pc-windows-msvc \
                --release \
                --locked
            } 2>&1 | tee "$log"; then
            exit 0
          fi
          {
            echo '### Windows bridge test failure'
            echo
            echo '```text'
            grep -Ein 'error(\[|:)|FAILED|panic|cannot find|unresolved' "$log" | head -n 80 || true
            tail -n 80 "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          failure_tail="$(
            {
              (grep -Ei 'error(\[|:)|FAILED|panic|cannot find|unresolved' "$log" || true) | head -n 40
              tail -n 20 "$log"
            } | tr '\r\n' ' ' | cut -c1-8000
          )"
          echo "::error title=Windows bridge test output::$failure_tail"
          exit 1

      - name: Package ${{ matrix.name }}
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/kitty-pro-${{ matrix.id }}-build.log"
          app_version="$(
            cargo metadata --locked --no-deps --format-version 1 \
              | jq -er '.packages[] | select(.name == "nsh-app-kitty") | .version'
          )"
          mkdir -p "dist/${{ matrix.id }}"
          if ! (cd packages/nsh-app && nsh package \
              --target "${{ matrix.target }}" \
              --app-version "$app_version" \
              -o "$GITHUB_WORKSPACE/dist/${{ matrix.id }}" \
              2>&1 | tee "$log"); then
            {
              echo "### ${{ matrix.name }} packaging failure"
              echo
              echo '```text'
              grep -Ein 'error|failed|panic|undefined reference|cannot find|not found|go:' "$log" \
                | head -n 120 || true
              tail -n 120 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            failure_tail="$(
              {
                (grep -Ei 'error|failed|panic|undefined reference|cannot find|not found|go:' "$log" || true) | head -n 80
                tail -n 40 "$log"
              } | tr '\r\n' ' ' | cut -c1-8000
            )"
            echo "::error title=${{ matrix.name }} packaging output::$failure_tail"
            exit 1
          fi

      - name: Publish ${{ matrix.name }} archive
        shell: bash
        run: |
          set -euo pipefail
          cd "dist/${{ matrix.id }}"
          # The architecture has to come from the machine that built the binary:
          # the in-app update check reads the CPU out of the asset name, so a name
          # that disagreed with the contents would install the wrong build.
          case "$(uname -m)" in
            arm64) arch="aarch64" ;;
            *) arch="$(uname -m)" ;;
          esac
          archive="Kitty-Pro-${{ matrix.id }}-${arch}"
          case "${{ matrix.id }}" in
            macos)
              # NSH leaves an ad hoc signed `.app` here; zip it, keeping the
              # bundle's own top-level entry so `ditto`/Finder restore it whole.
              bundle="$(find . -maxdepth 1 -type d -name '*.app' -print -quit)"
              test -n "$bundle"
              ditto -c -k --keepParent "$bundle" "$archive.zip"
              rm -rf "$bundle"
              ;;
            windows)
              # `nsh package` writes `<Name>.zip` beside `<Name>/`.
              produced="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
              test -n "$produced"
              mv "$produced" "$archive.zip"
              rm -rf -- "$(basename "$produced" .zip)"
              ;;
            linux)
              produced="$(find . -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
              test -n "$produced"
              mv "$produced" "$archive.tar.gz"
              ;;
          esac
          archive="$(find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print -quit)"
          test -n "$archive"

      - name: Verify desktop packages
        shell: bash
        run: |
          set -euo pipefail
          cd "dist/${{ matrix.id }}"
          archive="$(find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print -quit)"
          check_dir="$RUNNER_TEMP/kitty-pro-${{ matrix.id }}-verify"
          mkdir -p "$check_dir"
          case "$archive" in
            *.zip)
              if command -v unzip >/dev/null 2>&1; then
                unzip -qq "$archive" -d "$check_dir"
              else
                7z x -y -o"$check_dir" "$archive" >/dev/null
              fi
              ;;
            *.tar.gz) tar -xzf "$archive" -C "$check_dir" ;;
          esac
          # The executable is what carries the engine: an archive without it is an
          # empty shell, which is the failure mode worth failing the build on. The
          # name is matched loosely, and the mode bit not at all, because NSH derives
          # the runner's name from `nsh.json` per platform and a zip written on
          # Windows carries no Unix execute bit.
          test -n "$(
            find "$check_dir" -type f \
              \( -iname 'kittypro*' -o -iname 'kitty-pro*' -o -name '*.exe' \) \
              -print -quit
          )"

      # The macOS runner is the only one without GNU sha256sum.
      - name: Create desktop checksums
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            checksum() { shasum -a 256 "$1"; }
          else
            checksum() { sha256sum "$1"; }
          fi
          find "dist/${{ matrix.id }}" -maxdepth 1 -type f \
              \( -name '*.zip' -o -name '*.tar.gz' \) \
            -print0 | while IFS= read -r -d '' artifact; do
              if [[ -f "$artifact.sha256" ]]; then continue; fi
              name="$(basename "$artifact")"
              (cd "dist/${{ matrix.id }}" && checksum "$name" > "$name.sha256")
            done
          ls -la "dist/${{ matrix.id }}"

      - name: Upload ${{ matrix.name }} artifacts
        uses: actions/upload-artifact@v6
        with:
          name: kitty-pro-${{ matrix.id }}
          path: dist/${{ matrix.id }}/**
          if-no-files-found: error
          retention-days: 14

  # The self-hosted web control surface: the WebAssembly page `nsh package` builds
  # from the same crate, beside the native process that runs the core on its behalf.
  # A browser cannot load a Go archive, so both halves ship together and must be
  # built on the machine that will run them — hence a matrix rather than one archive.
  web:
    name: Web | ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            id: linux-x86_64
            os: ubuntu-24.04
            # The archive names the CPU as well as the OS, because the server binary
            # is native and the update check installs what the name promises. An
            # unlabelled macOS archive would be handed to an Intel Mac.
            archive_name: Kitty-Pro-web-linux-x86_64
          - name: macOS
            id: macos-aarch64
            # See the desktop job: `macos-14` is retired, `macos-15` is the same
            # arm64 hardware the `macos-aarch64` archive name promises.
            os: macos-15
            archive_name: Kitty-Pro-web-macos-aarch64
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      # The server embeds the core (`singbox`'s `embedded-core` is a default
      # feature), so this is a Go build as much as a Rust one.
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/singbox/bridge/go.mod
          cache-dependency-path: packages/singbox/bridge/go.sum

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      # Building the page compiles zstd's C for wasm32, which needs two tools a
      # runner is not guaranteed to have on PATH, and one of them is not the same
      # problem on each machine.
      #
      # The archiver: NSH asks for it by the bare name `llvm-ar` (it sets
      # `AR_wasm32_unknown_unknown`). Xcode's toolchain ships `ar` and several
      # `llvm-` tools but not `llvm-ar`; Ubuntu keeps it under
      # /usr/lib/llvm-18/bin. rustup's `llvm-tools` component exists on every
      # platform rustup runs on and installs it beside the compiler, so the
      # archiver and the compiler come from one pinned toolchain.
      #
      # The compiler is macOS-only: Apple's clang is built without the
      # WebAssembly backend, so it fails every translation unit with "unable to
      # create target: No available targets are compatible with triple
      # wasm32-unknown-unknown". Ubuntu's clang has the backend, which is why
      # only the macOS half of the web job ever saw this. A development machine
      # does not see it either — a current Xcode toolchain does have the backend
      # — so this is probed rather than assumed, and the probe compiles a file
      # for wasm32 instead of asking for a version: the last release was built by
      # a compiler that existed and could not do the job.
      - name: Provide the wasm toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup component add llvm-tools
          host="$(rustc -vV | sed -n 's/^host: //p')"
          bin="$(rustc --print sysroot)/lib/rustlib/$host/bin"
          test -x "$bin/llvm-ar" || {
            echo "llvm-tools did not install llvm-ar into $bin" >&2
            exit 1
          }
          echo "$bin" >> "$GITHUB_PATH"

          compiles_wasm() {
            printf 'int kitty_probe(void) { return 1; }\n' |
              "$1" --target=wasm32-unknown-unknown -x c -c - -o /dev/null \
              >/dev/null 2>&1
          }

          if [[ "$(uname -s)" != "Darwin" ]]; then
            command -v clang >/dev/null || {
              echo "no clang on PATH to build zstd's C for wasm32" >&2
              exit 1
            }
            compiles_wasm "$(command -v clang)" || {
              echo "clang on PATH cannot target wasm32-unknown-unknown" >&2
              exit 1
            }
            echo "WebAssembly C compiler: $(command -v clang)" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Homebrew's LLVM is a versioned keg, so it is on no PATH; the runner
          # image documents llvm@18 as preinstalled. Each candidate has to earn
          # the job by compiling.
          candidates=()
          for prefix in $(brew --prefix llvm@18 llvm 2>/dev/null || true); do
            if [[ -n "$prefix" ]]; then
              candidates+=("$prefix/bin/clang")
            fi
          done
          wasm_cc=""
          for candidate in "${candidates[@]+"${candidates[@]}"}"; do
            if [[ -x $candidate ]] && compiles_wasm "$candidate"; then
              wasm_cc="$candidate"
              break
            fi
          done
          if [[ -z "$wasm_cc" ]]; then
            echo "No preinstalled clang can target wasm32; installing llvm@18."
            brew install llvm@18
            prefix="$(brew --prefix llvm@18)"
            if [[ -x "$prefix/bin/clang" ]] && compiles_wasm "$prefix/bin/clang"; then
              wasm_cc="$prefix/bin/clang"
            fi
          fi
          if [[ -z "$wasm_cc" ]]; then
            echo "No clang on this runner can target wasm32-unknown-unknown." >&2
            echo "$(clang --version | head -n 1) is the default and it cannot." >&2
            exit 1
          fi
          # The variable name is the one cc-rs consults for this target, so the
          # host build of everything else keeps the system compiler.
          echo "CC_wasm32_unknown_unknown=$wasm_cc" >> "$GITHUB_ENV"
          echo "WebAssembly C compiler: $wasm_cc" >> "$GITHUB_STEP_SUMMARY"

      # The page is WebAssembly whatever machine builds it, so the web runtime is a
      # component here even on the macOS runner — that CLI ships the macOS runtime.
      - name: Set up NSH
        uses: ./.github/actions/setup-nsh
        with:
          version: ${{ env.NSH_VERSION }}
          components: web

      - name: Set tagged app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          release_version="$(
            jq -nr --arg tag "$GITHUB_REF_NAME" '$tag | ltrimstr("v")'
          )"
          ./scripts/set-package-version.sh "$release_version"

      - name: Reject an unversioned manual build
        if: "!startsWith(github.ref, 'refs/tags/v')"
        shell: bash
        env:
          KITTY_TEST_VERSION: ${{ inputs.test_version }}
        run: |
          if [[ -z "${KITTY_TEST_VERSION:-}" ]]; then
            echo "This run is not from a v* tag, so nothing here carries a release version." >&2
            echo "Enter test_version to build a throwaway with that version, or push a tag." >&2
            exit 1
          fi
          ./scripts/set-package-version.sh "$KITTY_TEST_VERSION"

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          key: web-${{ matrix.id }}
          cache-all-crates: true

      - name: Build the server and the page
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/kitty-pro-web-${{ matrix.id }}.log"
          if ! {
              cargo build --locked --release -p kitty-server
              (cd packages/nsh-app && nsh package --target web \
                  -o "$GITHUB_WORKSPACE/dist/web/site")
          } 2>&1 | tee "$log"; then
            {
              echo "### Web ${{ matrix.name }} build failure"
              echo
              echo '```text'
              tail -n 120 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # The two halves are one product: `main.rs` resolves the site as `public/`
      # beside the executable, so an archive that put them anywhere else serves no
      # page while still binding the port.
      - name: Assemble Web archive
        shell: bash
        run: |
          set -euo pipefail
          server="target/release/kitty-pro-web-server"
          test -x "$server"
          # The packaged directory is named after the app, so find it rather than
          # hard-coding "Kitty Pro": a rename would otherwise ship an archive with
          # no page in it, which is the failure this job exists to catch.
          site=""
          for candidate in dist/web/site/*; do
              [[ -f "$candidate/index.html" ]] && site="$candidate" && break
          done
          test -n "$site"
          package="dist/web/package"
          mkdir -p "$package"
          cp "$server" "$package/kitty-pro-web-server"
          cp -R "$site" "$package/public"
          printf '%s\n' \
            'Kitty Pro web control surface.' \
            '' \
            'Run: ./kitty-pro-web-server' \
            'Then open http://127.0.0.1:7897/ in a browser.' \
            '' \
            'Options: --port PORT, --allow-lan, --daemon [--log-file PATH].' \
            'IP selects the bind address (default 127.0.0.1); a non-loopback' \
            'address needs --allow-lan and KITTY_PRO_ALLOWED_HOSTS.' \
            'Stop with kill <PID>; --daemon prints it after readiness.' \
            > "$package/README.txt"
          archive="dist/web/${{ matrix.archive_name }}.tar.gz"
          tar -C "$package" -czf "$archive" .

      # An archive whose page cannot be found by the binary's own rule is worse than
      # no archive: the server starts, binds, and serves nothing.
      - name: Verify Web archive
        shell: bash
        run: |
          set -euo pipefail
          check="$RUNNER_TEMP/kitty-pro-web-verify"
          mkdir -p "$check"
          tar -xzf "dist/web/${{ matrix.archive_name }}.tar.gz" -C "$check"
          test -x "$check/kitty-pro-web-server"
          test -f "$check/public/index.html"
          # `find -quit`, not `ls | grep -q`: grep stops at its first match and
          # leaves `ls` writing into a closed pipe, and under `pipefail` that
          # SIGPIPE fails the step on the exact archive this step exists to approve.
          wasm="$(find "$check/public" -maxdepth 1 -type f -name '*.wasm' -print -quit)"
          [[ -n $wasm ]] || {
            echo "the page carries no WebAssembly, so it can never render" >&2
            exit 1
          }
          echo "site: $(basename "$wasm")"

      - name: Create Web checksum
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/web/${{ matrix.archive_name }}.tar.gz"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            shasum -a 256 "$archive" > "$archive.sha256"
          else
            sha256sum "$archive" > "$archive.sha256"
          fi

      - name: Upload Web artifact
        uses: actions/upload-artifact@v6
        with:
          name: kitty-pro-web-${{ matrix.id }}
          path: |
            dist/web/${{ matrix.archive_name }}.tar.gz
            dist/web/${{ matrix.archive_name }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      # One archive carries every ABI it was built for, because the update check
      # reads the CPU groups out of the file name and declines an asset that does not
      # list the device's — a 32-bit phone offered an arm64-only APK is a phone told
      # there is no build for it, forever. So a release builds both. A manual
      # throwaway builds one: each ABI is a full cross-build of the Go core and of
      # NSH's runtime, which is the difference between a check that finishes and one
      # that hits its timeout.
      - name: Choose the ABIs
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "KITTY_ABIS=arm64-v8a,armeabi-v7a" >> "$GITHUB_ENV"
          else
            echo "KITTY_ABIS=arm64-v8a" >> "$GITHUB_ENV"
            echo "Non-release build: packaging arm64-v8a only." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The SDK's own manager installs the three packages the build names. They are
      # pinned because `build-android.sh` reads `android.jar` and the NDK's clang out
      # of a specific revision, and it prefers that revision when it is present.
      - name: Install the Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.1 ndk;27.0.12077973"

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/singbox/bridge/go.mod
          cache-dependency-path: packages/singbox/bridge/go.sum

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Set up NSH
        uses: ./.github/actions/setup-nsh
        with:
          version: ${{ env.NSH_VERSION }}
          components: android

      # The VPN bridge is Kotlin and nothing else in this build has a Kotlin step, so
      # the compiler comes from Maven Central through the script the repository
      # tested. It prints the directory to point KOTLIN_HOME at, and nothing else.
      - name: Install the Kotlin compiler
        shell: bash
        run: echo "KOTLIN_HOME=$(./scripts/install-kotlinc.sh)" >> "$GITHUB_ENV"

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          key: android
          cache-all-crates: true

      - name: Set tagged app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          release_version="$(
            jq -nr --arg tag "$GITHUB_REF_NAME" '$tag | ltrimstr("v")'
          )"
          ./scripts/set-package-version.sh "$release_version"

      - name: Reject an unversioned manual build
        if: "!startsWith(github.ref, 'refs/tags/v')"
        shell: bash
        env:
          KITTY_TEST_VERSION: ${{ inputs.test_version }}
        run: |
          if [[ -z "${KITTY_TEST_VERSION:-}" ]]; then
            echo "This run is not from a v* tag, so nothing here carries a release version." >&2
            echo "Enter test_version to build a throwaway with that version, or push a tag." >&2
            exit 1
          fi
          ./scripts/set-package-version.sh "$KITTY_TEST_VERSION"

      # Signed with the same key every published APK has been signed with. Android
      # refuses an update whose signer differs, so a release whose secrets went
      # missing must stop here rather than fall back to a debug key: that builds an
      # APK that installs on a fresh phone and on nothing else, silently stranding
      # every device that already runs the app.
      - name: Configure the release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [[ -n "${KEYSTORE_BASE64:-}" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "${KEYSTORE_PASSWORD:-}" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "${KEY_ALIAS:-}" ]] || missing+=(ANDROID_KEY_ALIAS)
          if (( ${#missing[@]} )); then
            echo "::error title=Missing release signing secrets::${missing[*]}"
            echo "A tagged build cannot sign with the published key without them, and" >&2
            echo "signing with anything else strands every installed device." >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/kitty-pro-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          [[ -s $keystore ]] || {
            echo "ANDROID_KEYSTORE_BASE64 decoded to an empty keystore." >&2
            exit 1
          }
          # The names `build-android.sh` reads. Its own guard refuses a keystore
          # without an alias, which is the same mistake this step would otherwise
          # make for it.
          {
            echo "KITTY_KEYSTORE=$keystore"
            echo "KITTY_KEY_ALIAS=$KEY_ALIAS"
            echo "NSH_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KITTY_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Build the APK
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/kitty-pro-android.log"
          if ! ./scripts/build-android.sh --abi "$KITTY_ABIS" 2>&1 | tee "$log"; then
            {
              echo '### Android build failure'
              echo
              echo '```text'
              tail -n 150 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            failure_tail="$(
              {
                (grep -Ei 'error|failed|undefined reference|cannot find|not found|go:' "$log" || true) | tail -n 60
                tail -n 40 "$log"
              } | tr '\r\n' ' ' | cut -c1-8000
            )"
            echo "::error title=Android build output::$failure_tail"
            exit 1
          fi

      # The name is decided here rather than fixed: it carries the version and every
      # ABI inside, and `proxy_core::update` picks what a device installs out of it.
      - name: Checksum the APK
        shell: bash
        run: |
          set -euo pipefail
          ls dist/android/*.apk >/dev/null || {
            echo "build-android.sh left no APK in dist/android" >&2
            exit 1
          }
          (cd dist/android && for apk in *.apk; do sha256sum "$apk" > "$apk.sha256"; done)
          ls -la dist/android

      - name: Upload Android artifact
        uses: actions/upload-artifact@v6
        with:
          name: kitty-pro-android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - desktop
      - web
      - android
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          # The notes fallback groups commits since the previous tag, which
          # needs real tags in the clone; the default depth-1 checkout has
          # none.
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true

      - name: Build release notes
        shell: bash
        run: ./scripts/build-release-notes.sh --out release-body.md "$GITHUB_REF_NAME"

      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          fail_on_unmatched_files: true
          # One glob per channel the workflow builds. A channel missing from here
          # still reports a green run: the artifact is simply absent from the release
          # page, and `proxy_core::update` reads that page's asset list, so a release
          # without its `.apk` tells every phone there is nothing to install. The
          # desktop's `.dmg`/`.msi`/`.deb`/`.AppImage` globs went with the shells that
          # produced them; NSH ships one archive per platform.
          files: |
            release-assets/**/*.zip
            release-assets/**/*.tar.gz
            release-assets/**/*.apk
            release-assets/**/*.sha256
