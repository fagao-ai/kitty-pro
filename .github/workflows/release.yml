name: Build release packages

# One shell is published: the NSH desktop app. The Dioxus Web server and the
# Android APK had their own jobs here and both shells were deleted, so those
# artifacts and their signing setup are gone with them; NSH's web and Android
# targets are not ready to publish (see packages/nsh-app/README.md).
#
# NOT YET EXERCISED: this file was written when the desktop packaging moved off
# `dx bundle`. Run it from a throwaway tag before publishing a real release.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # Keep Cargo away from the Git-based crates.io index and libgit2. Windows
  # runners can otherwise crash while reading a restored registry index.
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUST_BACKTRACE: "1"
  RUST_VERSION: "1.97.1"

jobs:
  desktop:
    name: Desktop | ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            id: macos
            os: macos-14
            target: macos
          - name: Windows
            id: windows
            os: windows-latest
            target: windows
          - name: Linux
            id: linux
            os: ubuntu-24.04
            target: linux
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      # NSH's Linux host is GTK 4.14+, which ubuntu-24.04's libgtk-4-dev is.
      # librsvg2 is needed by the `svg` feature the app's icons use.
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            librsvg2-dev \
            patchelf \
            pkg-config

      - name: Install MinGW for the Windows Go bridge
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/singbox/bridge/go.mod
          cache-dependency-path: packages/singbox/bridge/go.sum

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Windows MSVC target
        if: matrix.id == 'windows'
        shell: bash
        run: rustup target add x86_64-pc-windows-msvc

      - name: Add MinGW to PATH
        if: runner.os == 'Windows'
        shell: bash
        run: |
          msys2_root='${{ steps.msys2.outputs.msys2-location }}'
          msys2_root="${msys2_root//\\//}"
          mingw_bin="$msys2_root/mingw64/bin"
          echo "$mingw_bin" >> "$GITHUB_PATH"
          echo "SINGBOX_CC=$mingw_bin/gcc.exe" >> "$GITHUB_ENV"
          echo 'CGO_ENABLED=1' >> "$GITHUB_ENV"

      - name: Install the NSH CLI
        shell: bash
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
          nsh --version

      - name: Set tagged app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          release_version="$(
            jq -nr --arg tag "$GITHUB_REF_NAME" '$tag | ltrimstr("v")'
          )"
          ./scripts/set-package-version.sh nsh-app-kitty "$release_version"

      - name: Cache Rust builds
        if: matrix.id != 'windows'
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.id }}
          cache-all-crates: true

      # The embedded sing-box core is a Go archive; on Windows it is a DLL built
      # by the bridge. This gate is independent of which front end ships, so it
      # stayed after the Dioxus shells were removed.
      - name: Test Windows embedded core bridge
        if: matrix.id == 'windows'
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/kitty-pro-windows-test.log"
          if {
              (cd packages/singbox/bridge && go test ./...)
              cargo test \
                --package singbox \
                --target x86_64-pc-windows-msvc \
                --release \
                --locked
            } 2>&1 | tee "$log"; then
            exit 0
          fi
          {
            echo '### Windows bridge test failure'
            echo
            echo '```text'
            grep -Ein 'error(\[|:)|FAILED|panic|cannot find|unresolved' "$log" | head -n 80 || true
            tail -n 80 "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          failure_tail="$(
            {
              (grep -Ei 'error(\[|:)|FAILED|panic|cannot find|unresolved' "$log" || true) | head -n 40
              tail -n 20 "$log"
            } | tr '\r\n' ' ' | cut -c1-8000
          )"
          echo "::error title=Windows bridge test output::$failure_tail"
          exit 1

      - name: Package ${{ matrix.name }}
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/kitty-pro-${{ matrix.id }}-build.log"
          app_version="$(
            cargo metadata --locked --no-deps --format-version 1 \
              | jq -er '.packages[] | select(.name == "nsh-app-kitty") | .version'
          )"
          mkdir -p "dist/${{ matrix.id }}"
          if ! (cd packages/nsh-app && nsh package \
              --target "${{ matrix.target }}" \
              --app-version "$app_version" \
              -o "$GITHUB_WORKSPACE/dist/${{ matrix.id }}" \
              2>&1 | tee "$log"); then
            {
              echo "### ${{ matrix.name }} packaging failure"
              echo
              echo '```text'
              grep -Ein 'error|failed|panic|undefined reference|cannot find|not found|go:' "$log" \
                | head -n 120 || true
              tail -n 120 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            failure_tail="$(
              {
                (grep -Ei 'error|failed|panic|undefined reference|cannot find|not found|go:' "$log" || true) | head -n 80
                tail -n 40 "$log"
              } | tr '\r\n' ' ' | cut -c1-8000
            )"
            echo "::error title=${{ matrix.name }} packaging output::$failure_tail"
            exit 1
          fi

      - name: Publish ${{ matrix.name }} archive
        shell: bash
        run: |
          set -euo pipefail
          cd "dist/${{ matrix.id }}"
          # The architecture has to come from the machine that built the binary:
          # the in-app update check reads the CPU out of the asset name, so a name
          # that disagreed with the contents would install the wrong build.
          case "$(uname -m)" in
            arm64) arch="aarch64" ;;
            *) arch="$(uname -m)" ;;
          esac
          archive="Kitty-Pro-${{ matrix.id }}-${arch}"
          case "${{ matrix.id }}" in
            macos)
              # NSH leaves an ad hoc signed `.app` here; zip it, keeping the
              # bundle's own top-level entry so `ditto`/Finder restore it whole.
              bundle="$(find . -maxdepth 1 -type d -name '*.app' -print -quit)"
              test -n "$bundle"
              ditto -c -k --keepParent "$bundle" "$archive.zip"
              rm -rf "$bundle"
              ;;
            windows)
              # `nsh package` writes `<Name>.zip` beside `<Name>/`.
              produced="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
              test -n "$produced"
              mv "$produced" "$archive.zip"
              rm -rf -- "$(basename "$produced" .zip)"
              ;;
            linux)
              produced="$(find . -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
              test -n "$produced"
              mv "$produced" "$archive.tar.gz"
              ;;
          esac
          archive="$(find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print -quit)"
          test -n "$archive"

      - name: Verify desktop packages
        shell: bash
        run: |
          set -euo pipefail
          cd "dist/${{ matrix.id }}"
          archive="$(find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print -quit)"
          check_dir="$RUNNER_TEMP/kitty-pro-${{ matrix.id }}-verify"
          mkdir -p "$check_dir"
          case "$archive" in
            *.zip)
              if command -v unzip >/dev/null 2>&1; then
                unzip -qq "$archive" -d "$check_dir"
              else
                7z x -y -o"$check_dir" "$archive" >/dev/null
              fi
              ;;
            *.tar.gz) tar -xzf "$archive" -C "$check_dir" ;;
          esac
          # The executable is what carries the engine: an archive without it is an
          # empty shell, which is the failure mode worth failing the build on. The
          # name is matched loosely, and the mode bit not at all, because NSH derives
          # the runner's name from `nsh.json` per platform and a zip written on
          # Windows carries no Unix execute bit.
          test -n "$(
            find "$check_dir" -type f \
              \( -iname 'kittypro*' -o -iname 'kitty-pro*' -o -name '*.exe' \) \
              -print -quit
          )"

      # The macOS runner is the only one without GNU sha256sum.
      - name: Create desktop checksums
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            checksum() { shasum -a 256 "$1"; }
          else
            checksum() { sha256sum "$1"; }
          fi
          find "dist/${{ matrix.id }}" -maxdepth 1 -type f \
              \( -name '*.zip' -o -name '*.tar.gz' \) \
            -print0 | while IFS= read -r -d '' artifact; do
              if [[ -f "$artifact.sha256" ]]; then continue; fi
              name="$(basename "$artifact")"
              (cd "dist/${{ matrix.id }}" && checksum "$name" > "$name.sha256")
            done
          ls -la "dist/${{ matrix.id }}"

      - name: Upload ${{ matrix.name }} artifacts
        uses: actions/upload-artifact@v6
        with:
          name: kitty-pro-${{ matrix.id }}
          path: dist/${{ matrix.id }}/**
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          # The notes fallback groups commits since the previous tag, which
          # needs real tags in the clone; the default depth-1 checkout has
          # none.
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true

      - name: Build release notes
        shell: bash
        run: ./scripts/build-release-notes.sh --out release-body.md "$GITHUB_REF_NAME"

      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.zip
            release-assets/**/*.tar.gz
            release-assets/**/*.sha256
