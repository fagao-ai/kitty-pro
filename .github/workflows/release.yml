name: Build release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  DIOXUS_CLI_VERSION: "0.7.9"
  KITTY_USE_DEFAULT_PROXY: "0"
  # Keep Cargo away from the Git-based crates.io index and libgit2. Windows
  # runners can otherwise crash while reading a restored registry index.
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUST_BACKTRACE: "1"
  RUST_VERSION: "1.97.1"

jobs:
  desktop:
    name: Desktop | ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            id: macos
            os: macos-14
            platform_flag: --macos
            target_args: ""
            bundle_args: --package-types macos --package-types dmg
          - name: Windows
            id: windows
            os: windows-latest
            platform_flag: --windows
            target_args: --target x86_64-pc-windows-gnu
            bundle_args: --package-types msi
          - name: Linux
            id: linux
            os: ubuntu-24.04
            platform_flag: --linux
            target_args: ""
            bundle_args: --package-types appimage --package-types deb
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            desktop-file-utils \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config

      - name: Install MinGW for the Windows Go bridge
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/singbox/bridge/go.mod
          cache-dependency-path: packages/singbox/bridge/go.sum

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Windows GNU target
        if: matrix.id == 'windows'
        shell: bash
        run: rustup target add x86_64-pc-windows-gnu

      - name: Set tagged desktop version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          release_version="$(
            jq -nr --arg tag "$GITHUB_REF_NAME" '$tag | ltrimstr("v")'
          )"
          if ! jq -en --arg version "$release_version" \
              '$version | test("^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$")' \
              >/dev/null; then
            echo "Release tag $GITHUB_REF_NAME is not a supported package version" >&2
            exit 1
          fi

          desktop_manifest="$(
            cargo metadata --locked --no-deps --format-version 1 \
              | jq -er '.packages[] | select(.name == "desktop") | .manifest_path'
          )"
          updated_manifest="$RUNNER_TEMP/desktop-Cargo.toml"
          jq -Rrsj --arg version "$release_version" '
            sub(
              "(?<prefix>\\[package\\]\\s+name\\s*=\\s*\"desktop\"\\s+version\\s*=\\s*\")[^\"]+(?<suffix>\")";
              "\(.prefix)\($version)\(.suffix)"
            )
          ' "$desktop_manifest" > "$updated_manifest"
          mv "$updated_manifest" "$desktop_manifest"

          # Cargo.lock records workspace package versions. Update exactly this
          # package entry after the manifest edit without upgrading dependencies.
          cargo update --package desktop --precise "$release_version"

          # Confirm that all later --locked builds see the tag-derived version.
          package_version="$(
            cargo metadata --locked --no-deps --format-version 1 \
              | jq -er '.packages[] | select(.name == "desktop") | .version'
          )"
          if [[ "$package_version" != "$release_version" ]]; then
            echo "desktop package version $package_version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Cache Rust builds
        if: matrix.id != 'windows'
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.id }}
          cache-all-crates: true

      - name: Install Dioxus CLI
        if: matrix.id != 'windows'
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}

      - name: Preserve Dioxus source line endings
        if: matrix.id == 'windows'
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout Dioxus CLI source
        if: matrix.id == 'windows'
        uses: actions/checkout@v5
        with:
          repository: DioxusLabs/dioxus
          ref: v${{ env.DIOXUS_CLI_VERSION }}
          path: .dioxus-cli-source

      - name: Install patched Dioxus CLI for Windows GNU
        if: matrix.id == 'windows'
        shell: bash
        run: |
          sed 's/\r$//' \
            .github/patches/dioxus-cli-0.7.9-windows-gnu.patch \
            | git -C .dioxus-cli-source apply -
          cargo install \
            --path .dioxus-cli-source/packages/cli \
            --locked

      - name: Add MinGW to PATH
        if: runner.os == 'Windows'
        shell: bash
        run: |
          msys2_root='${{ steps.msys2.outputs.msys2-location }}'
          msys2_root="${msys2_root//\\//}"
          mingw_bin="$msys2_root/mingw64/bin"
          echo "$mingw_bin" >> "$GITHUB_PATH"
          echo "CC=$mingw_bin/gcc.exe" >> "$GITHUB_ENV"
          echo "CXX=$mingw_bin/g++.exe" >> "$GITHUB_ENV"
          echo 'CGO_ENABLED=1' >> "$GITHUB_ENV"

      - name: Test Windows embedded core bridge
        if: matrix.id == 'windows'
        shell: bash
        run: |
          (cd packages/singbox/bridge && go test ./...)
          cargo test \
            --package singbox \
            --target x86_64-pc-windows-gnu \
            --release \
            --locked

      - name: Build ${{ matrix.name }} packages
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/kitty-pro-${{ matrix.id }}-build.log"
          if [[ "${{ matrix.id }}" == "windows" ]]; then
            # Pre-build the GNU binary so Cargo emits the WebView2 loader that
            # Dioxus then picks up through bundle.external_bin.
            if cargo build \
                --package desktop \
                --features desktop \
                --target x86_64-pc-windows-gnu \
                --release \
                --locked \
                2>&1 | tee "$log"; then
              webview2_loader="$(find \
                target/x86_64-pc-windows-gnu/release/build \
                -type f \
                -path '*/webview2-com-sys-*/out/x64/WebView2Loader.dll' \
                -print -quit)"
              if [[ -z "$webview2_loader" ]]; then
                echo 'Unable to locate the x64 WebView2Loader.dll build output' >&2
                exit 1
              fi

              mkdir -p target/windows-bundle
              cp "$webview2_loader" \
                target/windows-bundle/WebView2Loader.dll-x86_64-pc-windows-gnu

              bundle_output="$RUNNER_TEMP/kitty-pro-windows-bundle.jsonl"
              if dx bundle \
                  --package desktop \
                  ${{ matrix.platform_flag }} \
                  ${{ matrix.target_args }} \
                  --fullstack false \
                  --release \
                  --verbose \
                  --json-output \
                  --locked \
                  --out-dir dist/windows \
                  ${{ matrix.bundle_args }} \
                  2>&1 | tee -a "$log" "$bundle_output"; then
                build_status=0
                # Dioxus guarantees that the final JSON line contains the
                # structured BundleOutput with the generated artifact paths.
                mapfile -t msi_paths < <(
                  tail -n 1 "$bundle_output" \
                    | jq -er \
                      '.json | fromjson | .BundleOutput.bundles[] | select(ascii_downcase | endswith(".msi"))'
                )
                if [[ "${#msi_paths[@]}" -ne 1 ]]; then
                  echo 'Dioxus did not report exactly one Windows MSI output' >&2
                  exit 1
                fi

                # BundleOutput uses a native Windows path, while this step
                # runs in Git Bash and needs its POSIX representation.
                msi_path="$(cygpath -u "${msi_paths[0]}")"
                installer="$(pwd -P)/dist/windows/Kitty-Pro-windows-x86_64.msi"
                test -f "$msi_path"
                if [[ "$msi_path" != "$installer" ]]; then
                  mv "$msi_path" "$installer"
                fi

                extracted_dir="$RUNNER_TEMP/kitty-pro-windows-msi-package"
                package_dir="$RUNNER_TEMP/kitty-pro-windows-package"
                mkdir -p "$extracted_dir"
                mkdir -p "$package_dir"
                installer_windows="$(cygpath -w "$installer")"
                extracted_dir_windows="$(cygpath -w "$extracted_dir")"
                MSYS2_ARG_CONV_EXCL='*' msiexec.exe \
                  /a "$installer_windows" \
                  /qn \
                  TARGETDIR="$extracted_dir_windows"
                msi_executable="$(find "$extracted_dir" \
                  -type f -iname 'kitty-pro.exe' -print -quit)"
                msi_webview2_loader="$(find "$extracted_dir" \
                  -type f -name 'WebView2Loader.dll' -print -quit)"
                if [[ -z "$msi_executable" || -z "$msi_webview2_loader" ]]; then
                  echo 'Dioxus MSI is missing Kitty Pro or WebView2Loader.dll' >&2
                  exit 1
                fi
                cp "$msi_executable" "$package_dir/Kitty-Pro.exe"
                cp "$msi_webview2_loader" "$package_dir/"
                (
                  cd "$package_dir"
                  7z a -tzip -mx=9 Kitty-Pro-windows-x86_64.zip \
                    Kitty-Pro.exe WebView2Loader.dll >/dev/null
                )
                mv "$package_dir/Kitty-Pro-windows-x86_64.zip" \
                  "$(dirname "$installer")/"
                (
                  cd "$(dirname "$installer")"
                  sha256sum Kitty-Pro-windows-x86_64.zip \
                    > Kitty-Pro-windows-x86_64.zip.sha256
                  sha256sum "$(basename "$installer")" \
                    > Kitty-Pro-windows-x86_64.msi.sha256
                )
              else
                build_status=${PIPESTATUS[0]}
              fi
            else
              build_status=${PIPESTATUS[0]}
            fi
          elif [[ "${{ matrix.id }}" == "macos" ]]; then
            # hdiutil occasionally reports "Resource busy" on hosted macOS
            # runners even though the .app bundle was created successfully.
            # Retry only that transient failure; preserve all other failures.
            build_status=1
            for attempt in 1 2 3; do
              attempt_log="$RUNNER_TEMP/kitty-pro-macos-build-attempt-$attempt.log"
              echo "macOS bundle attempt $attempt/3" | tee -a "$log"
              if dx bundle \
                  --package desktop \
                  ${{ matrix.platform_flag }} \
                  ${{ matrix.target_args }} \
                  --fullstack false \
                  --release \
                  --verbose \
                  --locked \
                  --out-dir "dist/${{ matrix.id }}" \
                  ${{ matrix.bundle_args }} 2>&1 | tee -a "$log" "$attempt_log"; then
                build_status=0
                break
              else
                build_status=${PIPESTATUS[0]}
              fi
              if [[ "$attempt" -ge 3 ]] || \
                  ! grep -Eqi 'hdiutil:.*Resource busy' "$attempt_log"; then
                break
              fi
              rm -f target/dx/kitty-pro/bundle/macos/macos/*.dmg || true
              sleep $((attempt * 5))
            done
          elif dx bundle \
              --package desktop \
              ${{ matrix.platform_flag }} \
              ${{ matrix.target_args }} \
              --fullstack false \
              --release \
              --verbose \
              --locked \
              --out-dir "dist/${{ matrix.id }}" \
              ${{ matrix.bundle_args }} 2>&1 | tee "$log"; then
            build_status=0
          else
            build_status=${PIPESTATUS[0]}
          fi
          if [[ "$build_status" -ne 0 ]]; then
            {
              echo "### ${{ matrix.name }} build failure"
              echo
              echo '```text'
              grep -Ein 'error|failed|panic|undefined reference|cannot find|not found|go:' "$log" | head -n 120 || true
              tail -n 120 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            failure_tail="$(
              {
                (grep -Ei 'error|failed|panic|undefined reference|cannot find|not found|go:' "$log" || true) | head -n 80
                tail -n 40 "$log"
              } | tr '\r\n' ' ' | cut -c1-8000
            )"
            echo "::error title=${{ matrix.name }} build output::$failure_tail"
            exit 1
          fi

      - name: Verify desktop packages
        shell: bash
        run: |
          case "${{ matrix.id }}" in
            macos)
              test -n "$(find dist/macos -type d -name '*.app' -print -quit)"
              test -n "$(find dist/macos -type f -name '*.dmg' -print -quit)"
              ;;
            windows)
              archive=dist/windows/Kitty-Pro-windows-x86_64.zip
              installer=dist/windows/Kitty-Pro-windows-x86_64.msi
              verify_dir="$RUNNER_TEMP/kitty-pro-windows-verify"
              msi_verify_dir="$RUNNER_TEMP/kitty-pro-windows-msi-verify"
              test -f "$archive"
              test -f "$archive.sha256"
              test -f "$installer"
              test -f "$installer.sha256"
              mkdir -p "$verify_dir"
              7z x -y -o"$verify_dir" "$archive" >/dev/null
              test -f "$verify_dir/Kitty-Pro.exe"
              test -f "$verify_dir/WebView2Loader.dll"
              objdump -p "$verify_dir/Kitty-Pro.exe" \
                | grep -Eq 'Subsystem.*Windows GUI'
              objdump -p "$verify_dir/Kitty-Pro.exe" \
                | grep -Eqi 'DLL Name: WebView2Loader\.dll'
              objdump -f "$verify_dir/WebView2Loader.dll" \
                | grep -Eq 'architecture: i386:x86-64'
              if objdump -p "$verify_dir/Kitty-Pro.exe" \
                  | grep -Eqi 'DLL Name: (libgcc|libstdc\+\+|libwinpthread)[^ ]*\.dll'; then
                echo 'Windows package depends on an unbundled MinGW runtime DLL' >&2
                exit 1
              fi
              grep -aFq '.proxy-app' "$verify_dir/Kitty-Pro.exe"
              if grep -aFq \
                  'This should be replaced by dx as part of the build process' \
                  "$verify_dir/Kitty-Pro.exe"; then
                echo 'Windows executable still contains unresolved Dioxus asset paths' >&2
                exit 1
              fi

              mkdir -p "$msi_verify_dir"
              installer_windows="$(cygpath -w "$installer")"
              msi_verify_dir_windows="$(cygpath -w "$msi_verify_dir")"
              MSYS2_ARG_CONV_EXCL='*' msiexec.exe \
                /a "$installer_windows" \
                /qn \
                TARGETDIR="$msi_verify_dir_windows"
              msi_executable="$(find "$msi_verify_dir" \
                -type f -iname 'kitty-pro.exe' -print -quit)"
              msi_webview2_loader="$(find "$msi_verify_dir" \
                -type f -name 'WebView2Loader.dll' -print -quit)"
              test -n "$msi_executable"
              test -n "$msi_webview2_loader"
              cmp "$verify_dir/Kitty-Pro.exe" "$msi_executable"
              cmp "$verify_dir/WebView2Loader.dll" "$msi_webview2_loader"
              (cd dist/windows && sha256sum -c *.sha256)
              ;;
            linux)
              test -n "$(find dist/linux -type f -name '*.AppImage' -print -quit)"
              test -n "$(find dist/linux -type f -name '*.deb' -print -quit)"
              ;;
          esac

      - name: Upload ${{ matrix.name }} artifacts
        uses: actions/upload-artifact@v6
        with:
          name: kitty-pro-${{ matrix.id }}
          path: dist/${{ matrix.id }}/**
          if-no-files-found: error
          retention-days: 14

  web:
    name: Web | ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            id: linux-x86_64
            os: ubuntu-24.04
            archive_name: Kitty-Pro-web-linux-x86_64
          - name: macOS
            id: macos
            os: macos-14
            archive_name: Kitty-Pro-web-macos
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install Web build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen build-essential pkg-config

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/singbox/bridge/go.mod
          cache-dependency-path: packages/singbox/bridge/go.sum

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          key: web-${{ matrix.id }}
          cache-all-crates: true

      - name: Install Dioxus CLI
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}

      - name: Build fullstack Web package
        shell: bash
        run: |
          dx build \
            --package web \
            --web \
            --fullstack true \
            --release \
            --debug-symbols false \
            --locked

      - name: Assemble Web archive
        shell: bash
        run: |
          web_output="target/dx/web/release/web"
          test -x "$web_output/server"
          test -f "$web_output/public/index.html"

          mkdir -p dist/web/package
          cp "$web_output/server" dist/web/package/kitty-pro-web-server
          cp -R "$web_output/public" dist/web/package/public
          printf '%s\n' \
            'Run: ./kitty-pro-web-server' \
            'Default address: http://127.0.0.1:8080' \
            'Set IP and PORT environment variables to change the listen address.' \
            > dist/web/package/README.txt
          archive="dist/web/${{ matrix.archive_name }}.tar.gz"
          tar -C dist/web/package -czf "$archive" .
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            shasum -a 256 "$archive" > "$archive.sha256"
          else
            sha256sum "$archive" > "$archive.sha256"
          fi

      - name: Upload Web artifact
        uses: actions/upload-artifact@v6
        with:
          name: kitty-pro-web-${{ matrix.id }}
          path: |
            dist/web/${{ matrix.archive_name }}.tar.gz
            dist/web/${{ matrix.archive_name }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android | arm64-v8a
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
      ANDROID_NATIVE_API_LEVEL: "24"
      ANDROID_NDK_VERSION: "27.2.12479018"
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/singbox/bridge/go.mod
          cache-dependency-path: packages/singbox/bridge/go.sum

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android

      - name: Cache Rust and Gradle builds
        uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64-v8a
          cache-all-crates: true

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dioxus CLI
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}

      - name: Configure Android release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "Android release signing secrets are required so every APK remains upgrade-compatible." >&2
            echo "Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, and ANDROID_KEY_ALIAS." >&2
            exit 1
          fi

          keystore="$RUNNER_TEMP/kitty-pro-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          if [[ ! -s "$keystore" ]]; then
            echo "ANDROID_KEYSTORE_BASE64 decoded to an empty keystore." >&2
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"

      - name: Build Android APK
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/kitty-pro-android-build.log"
          if ! ./scripts/build-android-apk.sh 2>&1 | tee "$log"; then
            {
              echo '### Android build failure'
              echo
              echo '```text'
              tail -n 120 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            failure_tail="$(
              {
                (grep -Ei 'error|failed|undefined reference|cannot find|not found' "$log" || true) | tail -n 60
                tail -n 40 "$log"
              } | tr '\r\n' ' ' | cut -c1-8000
            )"
            echo "::error title=Android build output::$failure_tail"
            exit 1
          fi

      - name: Create APK checksum
        shell: bash
        run: |
          sha256sum dist/android/Kitty-Pro-arm64-v8a.apk \
            > dist/android/Kitty-Pro-arm64-v8a.apk.sha256

      - name: Upload Android artifact
        uses: actions/upload-artifact@v6
        with:
          name: kitty-pro-android-arm64-v8a
          path: |
            dist/android/Kitty-Pro-arm64-v8a.apk
            dist/android/Kitty-Pro-arm64-v8a.apk.sha256
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - desktop
      - web
      - android
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.zip
            release-assets/**/*.msi
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/**/*.tar.gz
            release-assets/**/*.sha256
            release-assets/**/*.apk
