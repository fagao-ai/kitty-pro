name: UI layout smoke

# Resize and dialog regressions in this shell are invisible to `cargo test`:
# they need a real layout engine. The suite drives the release web build in
# headless Chromium, so it runs on pull requests that touch the UI and on
# demand. It no longer triggers on push to main: direct pushes to this repo
# would otherwise start a full browser run next to every release, three
# parallel runs for one change. Trigger it manually before tagging when the
# UI is involved.

on:
  workflow_dispatch:
  pull_request:
    paths: &ui_paths
      - "packages/ui/**"
      - "packages/web/**"
      - "tests/ui-smoke/**"
      - ".github/workflows/ui-smoke.yml"

permissions:
  contents: read

concurrency:
  group: ui-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  DIOXUS_CLI_VERSION: "0.7.9"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUST_BACKTRACE: "1"
  RUST_VERSION: "1.97.1"
  # Playwright never needs to phone home in CI.
  PLAYWRIGHT_SKIP_BROWSER_GC: "1"

jobs:
  smoke:
    name: Web layout | Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install Web build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen build-essential pkg-config

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/singbox/bridge/go.mod
          cache-dependency-path: packages/singbox/bridge/go.sum

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          key: ui-smoke
          cache-all-crates: true

      - name: Install Dioxus CLI
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}

      # A debug wasm is ~84 MB and never finishes hydrating in a browser on a
      # CI box, which leaves the suite staring at a server-rendered shell with
      # no handlers. Release is ~2 MB and actually boots.
      - name: Build release Web bundle
        run: |
          dx build \
            --package web \
            --web \
            --fullstack true \
            --release \
            --debug-symbols false \
            --locked

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/ui-smoke/package-lock.json

      - name: Install Playwright
        working-directory: tests/ui-smoke
        run: npm ci

      - name: Install Chromium
        working-directory: tests/ui-smoke
        run: npx playwright install --with-deps chromium

      - name: Serve the bundle
        run: |
          stage=target/dx/web/release/web
          test -x "$stage/server"
          test -f "$stage/public/index.html"
          mkdir -p "$RUNNER_TEMP/kitty-web"
          cp "$stage/server" "$RUNNER_TEMP/kitty-web/kitty-pro-web-server"
          cp -R "$stage/public" "$RUNNER_TEMP/kitty-web/public"
          cd "$RUNNER_TEMP/kitty-web"
          # The app debounces a full-profile autosave; without an isolated
          # data directory those stubbed writes would land in the machine's
          # real Kitty Pro state (it clobbered a developer profile once).
          mkdir -p "$RUNNER_TEMP/kitty-profile"
          KITTY_PROFILE_DIR="$RUNNER_TEMP/kitty-profile" PORT=7897 ./kitty-pro-web-server --daemon --log-file ./web.log
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:7897/; then
              echo "web server is up"
              exit 0
            fi
            sleep 1
          done
          echo "web server never became ready" >&2
          cat ./web.log >&2 || true
          exit 1

      - name: Run layout smoke test
        working-directory: tests/ui-smoke
        env:
          KITTY_WEB_URL: http://127.0.0.1:7897
        # `npm test` rather than a file list: the spec list lives in
        # package.json, and a hardcoded copy here silently skips new suites.
        run: npm test

      # Proves the budgets above are able to fail; a guard that cannot is worse
      # than none. Separate step so a broken assertion names itself.
      - name: Verify the guard still bites
        working-directory: tests/ui-smoke
        env:
          KITTY_WEB_URL: http://127.0.0.1:7897
          KITTY_NEGCHECK: "1"
        run: npx playwright test negcheck.spec.js

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-report
          path: |
            tests/ui-smoke/test-results/
            tests/ui-smoke/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Show the web server log
        if: failure()
        run: cat "$RUNNER_TEMP/kitty-web/web.log" || true
