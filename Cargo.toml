[workspace]
resolver = "2"
members = [
    "packages/nsh-app",
    "packages/api",
    "packages/server",
    "packages/proxy-core",
    "packages/singbox",
]

[workspace.package]
# The one version every package in this workspace carries, and the number the
# release workflow stamps from the tag. It belongs here rather than in each
# manifest because the in-app update check reads `env!("CARGO_PKG_VERSION")` from
# `api` — the crate that answers it is not the shell that displays it — so a
# per-package version is a per-package chance to answer with the wrong number.
version = "1.0.14"

[workspace.dependencies]
# workspace
api = { path = "packages/api" }
proxy-core = { path = "packages/proxy-core" }
singbox = { path = "packages/singbox" }
