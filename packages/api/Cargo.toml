[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["fullstack"] }
proxy-core = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories = "6"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
singbox = { workspace = true }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
sysproxy = { git = "https://github.com/clash-verge-rev/sysproxy-rs", branch = "main" }
sysinfo = "0.38"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }
windows-registry = "0.6"

[target.'cfg(target_os = "linux")'.dependencies.auto-launch]
version = "=0.6.0"
optional = true

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[features]
native-desktop = []
server = ["dioxus/server"]
