[package]
name = "desktop"
version = "0.1.0"
edition = "2021"
autobins = false

[[bin]]
name = "kitty-pro"
path = "src/main.rs"

[dependencies]
dioxus = { workspace = true, features = ["router"] }
api = { workspace = true }
ui = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
singbox = { workspace = true }

[features]
# `desktop` is the point of this package, so a plain `cargo build` at the root has to produce a
# window. Without it the `not(feature = "desktop")` main runs instead, and because `api` pulls in
# `dioxus/fullstack`, `dioxus::launch` becomes a *web server* that dies on
# `Couldn't read public directory at target/debug/public` — exit 101, no window, and a message
# about a folder nobody was asked to build. `dx` builds for the web and Android name their
# package, so nothing here depends on the flag being off by default.
default = ["desktop"]
desktop = ["dioxus/desktop", "ui/native-desktop"]
server = ["dioxus/fullstack", "dioxus/server", "ui/server"]
