[package]
name = "desktop"
version = "0.1.0"
edition = "2021"
autobins = false

[[bin]]
name = "kitty-pro"
path = "src/main.rs"

[dependencies]
dioxus = { workspace = true, features = ["router", "fullstack"] }
api = { workspace = true }
ui = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
singbox = { workspace = true }

[build-dependencies]
winresource = "0.1"

[features]
default = []
desktop = ["dioxus/desktop"]
server = ["dioxus/server", "ui/server"]
