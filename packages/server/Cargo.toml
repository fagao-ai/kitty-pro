[package]
name = "kitty-server"
version = "0.1.0"
edition = "2021"
publish = false

# The web control surface: the NSH app's static site, served beside an HTTP API
# over `api`. A browser cannot run sing-box, so this process is where the proxy
# actually runs when the UI is a page — the same shape the deleted Dioxus web
# shell had, minus Dioxus.
[[bin]]
name = "kitty-pro-web-server"
path = "src/main.rs"

[dependencies]
api = { workspace = true }
proxy-core = { workspace = true }
singbox = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
# `precompressed_br`/`_gzip` are inherent `ServeDir` methods under `fs`; there is
# no `precompressed` feature to ask for.
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
getrandom = "0.3"
directories = "6"

[dev-dependencies]
# `oneshot` is what lets a test drive the router without a listener.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
