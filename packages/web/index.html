<!DOCTYPE html>
<!--
  自定义 index.html：dx 0.7 检测到 crate 根存在本文件后，会在其 head 区
  注入打包好的样式与 preload 链接、在 body 尾部注入加载脚本，并把标题占位
  符替换为 Dioxus.toml 配置的应用名。注意：dx 按字符串首次出现位置做注入，
  注释里绝不能出现这些注入锚点或占位符的字面量，否则资源会被注进注释导致
  样式与脚本全部丢失（2026-11-05 踩过，勿再犯）。
  本文件存在的意义：axe 扫描（U24）要求 html 元素带 lang——整个界面是简体
  中文，缺 lang 会让读屏器用错误引擎发音；默认模板没有这个属性。
-->
<html lang="zh-CN">
    <head>
        <title>{app_title}</title>
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta charset="UTF-8">
        <meta name="description" content="Kitty Pro —— 基于内嵌 sing-box 内核的跨平台代理客户端">
    </head>
    <body>
        <div id="main"></div>
    </body>
</html>
